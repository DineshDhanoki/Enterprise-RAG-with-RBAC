name: Bug report
description: Report a reproducible problem in the prototype or documentation
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please search existing issues first and remove any sensitive information.
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the browser, viewport, and exact steps.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or console output, but never credentials or private data.
